spring:
  application:
    name: ecommerce-legado-ddd

  # Nenhuma credencial fica no código: os valores vêm de variáveis de
  # ambiente, e o padrão após ":" só existe porque o banco é H2 em memória.
  # Ao trocar por um banco real, defina DB_URL, DB_USERNAME e DB_PASSWORD
  # no ambiente — nada precisa ser versionado.
  datasource:
    url: ${DB_URL:jdbc:h2:mem:ecommerce;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: create-drop
    # OSIV desligado: a sessão não sobrevive à camada web. As respostas são
    # DTOs montados dentro da transação, o que também evita serializar
    # entidades JPA diretamente na API.
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Chave do Branch by Abstraction.
#   local  -> contexto de Pagamento no mesmo processo (fase atual)
#   remoto -> mesmo contrato sobre HTTP, quando o contexto virar um serviço
pagamento:
  modo: local
  url: http://localhost:8081

logging:
  level:
    # O log de parâmetros vinculados ao JDBC (org.hibernate.orm.jdbc.bind)
    # foi desligado de propósito: num contexto de pagamento, é por ele que
    # dados de cartão vazam para o log. Para depurar, suba com
    #   --logging.level.org.hibernate.SQL=DEBUG
    org.hibernate.SQL: ${LOG_SQL:INFO}
